  const pp = h('input', { type: 'password', placeholder: t('unlock.placeholder'), 'aria-label': t('unlock.placeholder') });
  u.appendChild(pp);

  dbGet().then(rec => {
    if (rec?.hint) {
      const hintEl = h('div', { class: 'hint' }, t('unlock.hint_prefix', { hint: rec.hint }));
      u.insertBefore(hintEl, pp.nextSibling);
    }
  });

  if (errMsg) u.appendChild(h('p', { class: 'danger' }, errMsg));
  const btn = h('button', { class: 'primary', style: 'width:100%; margin-top:8px' }, t('unlock.btn'));
  btn.addEventListener('click', async () => {
    const ok = await Vault.unlock(pp.value);
    if (ok) { state.view = 'today'; applyTheme(Vault.data.settings.theme); render(); }
    else renderUnlock(t('unlock.err'));
  });
  pp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  u.appendChild(btn);

  const helperRow = h('div', { class: 'row', style: 'margin-top:20px; justify-content:center' });
  helperRow.appendChild(h('button', { class: 'ghost', onclick: () => {
    if (confirm(t('unlock.restore_confirm'))) importEncrypted();
  }}, t('unlock.restore')));
  u.appendChild(helperRow);

  root.appendChild(u);
  setTimeout(() => pp.focus(), 0);
}

// ---------------------------------------------------------------------------
// Importers — Apple Health XML, Flo JSON, Clue CSV
// Each returns { days: { ymd: partialDay }, source: "label", warnings: [] }
// ---------------------------------------------------------------------------

// Normalise to a flow value we understand
function normaliseFlow(raw) {
  if (raw == null) return null;
  const s = String(raw).toLowerCase().trim();
  if (!s) return null;
  if (s.includes('none') || s === 'no' || s === '0') return 'none';
  if (s.includes('spot')) return 'spotting';
  if (s.includes('unspecified') || s === 'yes' || s === '1') return 'light';
  if (s.includes('light')) return 'light';
  if (s.includes('medium') || s.includes('moderate') || s.includes('normal')) return 'medium';
  if (s.includes('heavy')) return 'heavy';
  return null;
}

// Apple Health export.xml: large file. Use regex over the stringified content to avoid
// DOMParser OOM on 50MB+ exports. We pull only MenstrualFlow + IntermenstrualBleeding records.
function parseAppleHealth(xmlText) {
  const days = {};
  const warnings = [];
  let flowCount = 0, spotCount = 0;

  // MenstrualFlow records
  const flowRe = /<Record\b[^>]*type="HKCategoryTypeIdentifierMenstrualFlow"[^>]*\/?>/g;
  let m;
  while ((m = flowRe.exec(xmlText)) !== null) {
    const tag = m[0];
    const valueMatch = tag.match(/\svalue="([^"]+)"/);
    const startMatch = tag.match(/\sstartDate="([^"]+)"/);
    if (!startMatch) continue;
    const dateStr = parseAppleDate(startMatch[1]);
    if (!dateStr) continue;
    const flow = normaliseFlow(valueMatch ? valueMatch[1].replace('HKCategoryValueMenstrualFlow', '') : 'unspecified');
    if (!flow) continue;
    days[dateStr] = days[dateStr] || {};
    // Keep the highest severity on the same day if multiple records exist
    days[dateStr].flow = mergeFlow(days[dateStr].flow, flow);
    flowCount++;
  }

  // IntermenstrualBleeding -> spotting
  const spotRe = /<Record\b[^>]*type="HKCategoryTypeIdentifierIntermenstrualBleeding"[^>]*\/?>/g;
  while ((m = spotRe.exec(xmlText)) !== null) {
    const startMatch = m[0].match(/\sstartDate="([^"]+)"/);
    if (!startMatch) continue;
    const dateStr = parseAppleDate(startMatch[1]);
    if (!dateStr) continue;
    days[dateStr] = days[dateStr] || {};
    days[dateStr].flow = mergeFlow(days[dateStr].flow, 'spotting');
    spotCount++;
  }

  if (flowCount === 0 && spotCount === 0) {
    warnings.push('No menstrual flow records found in this file. Confirm you exported from Apple Health as export.xml (unzipped).');
  }
  return { days, source: 'Apple Health', warnings, counts: { flow: flowCount, spotting: spotCount } };
}

// Apple Health dates look like "2024-01-15 07:30:00 -0800". We take the date portion
// in the file's stated offset — treat as local date of the event.
function parseAppleDate(s) {
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

// Severity ordering for merging flow on the same day
const FLOW_RANK = { none: 0, spotting: 1, light: 2, medium: 3, heavy: 4 };
function mergeFlow(existing, incoming) {
  if (!existing) return incoming;
  return FLOW_RANK[incoming] > FLOW_RANK[existing] ? incoming : existing;
}

// Flo JSON: format varies across exports. We accept:
//   - Array of { date, period | flow | intensity, symptoms, notes, mood }
//   - { days: [...] } or { data: [...] } wrappers
//   - Date can be ISO (2024-01-15T...) or YYYY-MM-DD or MM/DD/YYYY
function parseFlo(jsonText) {
  const days = {};
  const warnings = [];
  let data;
  try { data = JSON.parse(jsonText); }
  catch (e) { return { days, source: 'Flo', warnings: ['File is not valid JSON.'], counts: { flow: 0 } }; }

  let rows = data;
  if (rows && !Array.isArray(rows)) {
    rows = rows.days || rows.data || rows.entries || rows.records || null;
  }
  if (!Array.isArray(rows)) {
    warnings.push('Could not find a day list in this Flo export. Expected an array of daily records.');
    return { days, source: 'Flo', warnings, counts: { flow: 0 } };
  }

  let count = 0;
  for (const row of rows) {
    if (!row || typeof row !== 'object') continue;
    const dateRaw = row.date || row.day || row.logDate || row.startDate;
    const dateStr = normaliseDate(dateRaw);
    if (!dateStr) continue;
    const d = days[dateStr] || {};

    const flow = normaliseFlow(row.period_intensity || row.intensity || row.flow || row.period);
    if (flow) { d.flow = mergeFlow(d.flow, flow); count++; }

    if (Array.isArray(row.symptoms) && row.symptoms.length) {
      d.symptoms = [...new Set([...(d.symptoms || []), ...row.symptoms.map(String)])];
    }
    if (Array.isArray(row.mood) && row.mood.length) {
      d.mood = [...new Set([...(d.mood || []), ...row.mood.map(String)])];
    }
    if (row.notes && typeof row.notes === 'string') {
      d.notes = d.notes ? `${d.notes}\n${row.notes}` : row.notes;
    }
    days[dateStr] = d;
  }

  if (count === 0) warnings.push('No period-flow entries recognised in this file.');
  return { days, source: 'Flo', warnings, counts: { flow: count } };
}

// Clue CSV: header row, comma-separated, quoted fields allowed.
function parseClue(csvText) {
  const days = {};
  const warnings = [];
  const rows = parseCsv(csvText);
  if (rows.length < 2) {
    return { days, source: 'Clue', warnings: ['File is empty or has no data rows.'], counts: { flow: 0 } };
  }
  const header = rows[0].map(s => s.trim().toLowerCase());
  const col = name => header.indexOf(name);
  const dayCol = col('day') >= 0 ? col('day') : col('date');
  const periodCol = col('period');
  const intensityCol = col('period_intensity') >= 0 ? col('period_intensity') : col('intensity');
  if (dayCol < 0) {
    warnings.push('No "day" or "date" column found.');
    return { days, source: 'Clue', warnings, counts: { flow: 0 } };
  }
  let count = 0;
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const dateStr = normaliseDate(row[dayCol]);
    if (!dateStr) continue;
    const d = days[dateStr] || {};
    const intensity = intensityCol >= 0 ? row[intensityCol] : (periodCol >= 0 ? row[periodCol] : null);
    const flow = normaliseFlow(intensity);
    if (flow) { d.flow = mergeFlow(d.flow, flow); count++; }
    days[dateStr] = d;
  }
  if (count === 0) warnings.push('No period-flow entries recognised. Confirm this is a Clue CSV export.');
  return { days, source: 'Clue', warnings, counts: { flow: count } };
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normaliseDate(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  // ISO or YYYY-MM-DD
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  // MM/DD/YYYY
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  // DD.MM.YYYY
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // Unix epoch
  if (/^\d{10,13}$/.test(s)) {
    const ms = s.length === 10 ? Number(s) * 1000 : Number(s);
    const d = new Date(ms);
    if (!isNaN(d)) return ymd(d);
  }
  return null;
}

// Compute diff between an import result and current Vault.data.days
function computeImportDiff(incomingDays) {
  const added = [], merged = [], unchanged = [];
  for (const [date, partial] of Object.entries(incomingDays)) {
    const cur = Vault.data.days[date];
    if (!cur) {
      if (partial.flow || partial.symptoms?.length || partial.mood?.length || partial.notes) {
        added.push(date);
      }
      continue;
    }
    // Conflict checks
    const curFlow = cur.flow || 'none';
    const incFlow = partial.flow;
    if (incFlow && incFlow !== curFlow) merged.push(date);
    else unchanged.push(date);
  }
  return { added, merged, unchanged };
}

// Apply import. Strategy: merge non-destructively — existing day wins on conflict unless
// the user chose "overwrite". Flow is merged by severity when not overwriting.
function applyImport(incomingDays, overwrite) {
  let changed = 0;
  for (const [date, partial] of Object.entries(incomingDays)) {
    const cur = Vault.data.days[date] || blankDay();
    const next = { ...cur };
    if (partial.flow) {
      if (overwrite) next.flow = partial.flow;
      else next.flow = mergeFlow(next.flow === 'none' ? null : next.flow, partial.flow) || 'none';
    }
    if (partial.symptoms?.length) {
      next.symptoms = [...new Set([...(next.symptoms || []), ...partial.symptoms])];
    }
    if (partial.mood?.length) {
      next.mood = [...new Set([...(next.mood || []), ...partial.mood])];
    }
    if (partial.notes) {
      next.notes = overwrite ? partial.notes : (next.notes ? `${next.notes}\n\n[imported] ${partial.notes}` : partial.notes);
    }
    Vault.data.days[date] = next;
    changed++;
  }
  return changed;
}

// ---------------------------------------------------------------------------
// Import UI
// ---------------------------------------------------------------------------
function openImportPicker(onStarted) {
  modal(close => {
    const box = h('div');
    box.appendChild(h('h2', { style: 'margin-top:0' }, t('import.title')));
    box.appendChild(h('p', { class: 'mute-small' }, t('import.body')));
    const opts = [
      { id: 'apple', label: t('import.apple'), accept: '.xml,text/xml,application/xml', parser: parseAppleHealth },
      { id: 'flo', label: t('import.flo'), accept: '.json,application/json', parser: parseFlo },
      { id: 'clue', label: t('import.clue'), accept: '.csv,text/csv', parser: parseClue },
    ];
    for (const o of opts) {
      const btn = h('button', {
        style: 'width:100%; text-align:left; margin-top:8px',
        onclick: () => { close(); pickAndParseFile(o, onStarted); },
      }, o.label);
      box.appendChild(btn);
    }
    const row = h('div', { class: 'row', style: 'justify-content:flex-end; margin-top:14px' }, [
      h('button', { onclick: close }, t('modal.cancel')),
    ]);
    box.appendChild(row);
    return box;
  });
}

function pickAndParseFile(opt, onStarted) {
  const input = h('input', { type: 'file', accept: opt.accept });
  input.onchange = async () => {
    const f = input.files[0]; if (!f) return;
    toast(t('import.reading', { name: f.name }));
    try {
      const text = await f.text();
      const result = opt.parser(text);
      showImportPreview(result, onStarted);
    } catch (e) {
      toast(t('import.read_fail'));
    }
  };
  input.click();
}

function showImportPreview(result, onStarted) {
  modal(close => {
    const box = h('div');
    box.appendChild(h('h2', { style: 'margin-top:0' }, t('import.preview_title', { source: result.source })));

    if (result.warnings.length) {
      for (const w of result.warnings) box.appendChild(h('p', { class: 'warn' }, w));
    }

    const dayCount = Object.keys(result.days).length;
    if (dayCount === 0) {
      box.appendChild(h('p', {}, t('import.nothing')));
      box.appendChild(h('div', { class: 'row', style: 'justify-content:flex-end; margin-top:12px' }, [
        h('button', { onclick: close }, t('modal.close')),
      ]));
      return box;
    }

    const diff = Vault.data ? computeImportDiff(result.days) : { added: Object.keys(result.days), merged: [], unchanged: [] };

    box.appendChild(h('div', { class: 'diff-counts' }, [
      h('span', {}, [h('span', { class: 'k' }, t('import.new_days') + ': '), h('span', { class: 'v' }, String(diff.added.length))]),
      h('span', {}, [h('span', { class: 'k' }, t('import.merge') + ': '), h('span', { class: 'v' }, String(diff.merged.length))]),
      h('span', {}, [h('span', { class: 'k' }, t('import.unchanged') + ': '), h('span', { class: 'v' }, String(diff.unchanged.length))]),
    ]));

    const sample = Object.entries(result.days).slice(0, 6);
    if (sample.length) {
      const table = h('table', { class: 'diff-table' });
      const thead = h('thead', {}, h('tr', {}, [
        h('th', {}, t('import.cols.date')),
        h('th', {}, t('import.cols.flow')),
      ]));
      table.appendChild(thead);
      const tbody = h('tbody');
      for (const [date, d] of sample) {
        tbody.appendChild(h('tr', {}, [h('td', {}, date), h('td', {}, d.flow || '—')]));
      }
      table.appendChild(tbody);
      box.appendChild(table);
      if (dayCount > sample.length) box.appendChild(h('p', { class: 'mute-small' }, t('import.more', { n: dayCount - sample.length })));
    }

    const overwriteLabel = h('label', { style: 'display:flex; gap:8px; align-items:center; margin-top:14px' });
    const cb = h('input', { type: 'checkbox' });
    overwriteLabel.appendChild(cb);
    overwriteLabel.appendChild(document.createTextNode(t('import.overwrite')));
    box.appendChild(overwriteLabel);

    const row = h('div', { class: 'row', style: 'justify-content:flex-end; margin-top:14px' }, [
      h('button', { onclick: close }, t('modal.cancel')),
      h('button', { class: 'primary', onclick: async () => {
        if (!Vault.data) { close(); onStarted?.(result); return; }
        const n = applyImport(result.days, cb.checked);
        await save();
        close();
        toast(n === 1 ? t('import.done', { n }) : t('import.done_plural', { n }));
        render();
      }}, t('import.btn')),
    ]);
    box.appendChild(row);
    return box;
  });
}

// ---------------------------------------------------------------------------
// Printable clinician summary
// ---------------------------------------------------------------------------
function renderPrintSummary() {
  const container = document.getElementById('printRoot');
  container.innerHTML = '';
  const cycles = Vault.data.cycles || [];
  const full = cycles.filter(c => c.lengthDays != null);

  const wrap = h('div');
  wrap.appendChild(h('h1', {}, t('print.title')));
  wrap.appendChild(h('div', { class: 'muted' }, new Date().toLocaleString(I18N.current)));

  wrap.appendChild(h('h2', {}, t('stats.summary')));
  const stats = h('table');
  const tbody = h('tbody');
  const addRow = (k, v) => tbody.appendChild(h('tr', {}, [h('td', {}, k), h('td', {}, String(v))]));
  addRow(t('stats.cycles_recorded'), cycles.length);
  addRow(t('stats.full_cycles'), full.length);
  if (full.length) {
    const lens = full.map(c => c.lengthDays);
    const mean = lens.reduce((a, b) => a + b, 0) / lens.length;
    const min = Math.min(...lens), max = Math.max(...lens);
    addRow(t('stats.avg_cycle'), t('stats.days', { n: mean.toFixed(1) }));
    addRow(`${t('stats.shortest')} / ${t('stats.longest')}`, t('stats.days', { n: `${min} / ${max}` }));
    const periodLens = cycles.map(c => c.periodLengthDays).filter(n => n > 0);
    if (periodLens.length) {
      const pm = periodLens.reduce((a, b) => a + b, 0) / periodLens.length;
      addRow(t('stats.avg_period'), t('stats.days', { n: pm.toFixed(1) }));
    }
  }
  const pred = predict(cycles);
  if (pred) addRow(t('today.prediction'), `${pred.windowStart} – ${pred.windowEnd}`);
  stats.appendChild(tbody);
  wrap.appendChild(stats);

  if (cycles.length) {
    wrap.appendChild(h('h2', {}, t('print.history')));
    const table = h('table');
    table.appendChild(h('thead', {}, h('tr', {}, [
      h('th', {}, 'Start'),
      h('th', {}, 'End'),
      h('th', {}, t('stats.cycle_length')),
      h('th', {}, t('stats.avg_period')),
    ])));
    const tb = h('tbody');
    for (const c of cycles.slice(-12)) {
      tb.appendChild(h('tr', {}, [
        h('td', {}, c.startDate),
        h('td', {}, c.endDate || '—'),
        h('td', {}, c.lengthDays != null ? String(c.lengthDays) : '—'),
        h('td', {}, c.periodLengthDays ? String(c.periodLengthDays) : '—'),
      ]));
    }
    table.appendChild(tb);
    wrap.appendChild(table);
  }

  const symCount = {};
  for (const d of Object.values(Vault.data.days)) {
    for (const s of (d.symptoms || [])) symCount[s] = (symCount[s] || 0) + 1;
  }
  const symEntries = Object.entries(symCount).sort((a, b) => b[1] - a[1]).slice(0, 15);
  if (symEntries.length) {
    wrap.appendChild(h('h2', {}, t('stats.top_symptoms')));
    const table = h('table');
    const tb = h('tbody');
    for (const [name, count] of symEntries) {
      tb.appendChild(h('tr', {}, [h('td', {}, name), h('td', {}, count === 1 ? t('stats.days_one', { n: count }) : t('stats.days', { n: count }))]));
    }
    table.appendChild(tb);
    wrap.appendChild(table);
  }

  wrap.appendChild(h('div', { class: 'disclaimer' }, t('settings.disclaimer')));

  container.appendChild(wrap);
}

function printClinicianSummary() {
  renderPrintSummary();
  // Let layout settle before print
  requestAnimationFrame(() => {
    window.print();
  });
}

// ---------------------------------------------------------------------------
// Quick-hide — Escape or long-press → blur overlay. Tap to reveal, or require
// passphrase if the vault has one.
// ---------------------------------------------------------------------------
const QuickHide = {
  overlayEl: null,
  active: false,

  show() {
    if (this.active) return;
    this.active = true;
    const ov = h('div', { id: 'hideOverlay', role: 'dialog', 'aria-label': t('quickhide.message') });
    ov.appendChild(h('div', { class: 'badge' }));
    ov.appendChild(h('div', { class: 'msg' },
      Vault.hasPassphrase ? t('quickhide.message_locked') : t('quickhide.message')));
    ov.addEventListener('click', () => this.tryReveal());
    this.overlayEl = ov;
    document.body.appendChild(ov);
  },

  async tryReveal() {
    if (!Vault.hasPassphrase) { this.hide(); return; }
    // Lock the vault and require passphrase re-entry
    Vault.lock();
    this.hide();
    renderUnlock();
  },

  hide() {
    if (this.overlayEl) this.overlayEl.remove();
    this.overlayEl = null;
    this.active = false;
  },

  bind() {
    // Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && Vault.data) { this.show(); }
    });
    // Long-press (500ms)
    let pressTimer = null;
    const start = (e) => {
      if (!Vault.data || this.active) return;
      if (e.target.closest('button,input,textarea,select,a,[role="button"],[contenteditable]')) return;
      pressTimer = setTimeout(() => this.show(), 500);
    };
    const cancel = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    document.addEventListener('touchstart', start, { passive: true });
    document.addEventListener('touchend', cancel);
    document.addEventListener('touchmove', cancel);
    document.addEventListener('mousedown', start);
    document.addEventListener('mouseup', cancel);
    document.addEventListener('mouseleave', cancel);
  },
};

// ---------------------------------------------------------------------------
// Reminders — opt-in, same-session only (no background wake, no push server).
// If Lunar is open in a tab and conditions match, we fire a Notification.
// Rechecked on every save + on a 30-minute interval while the tab is visible.
// ---------------------------------------------------------------------------
const Reminders = {
  timer: null,
  firedToday: { logToday: null, periodSoon: null }, // ymd of last fire

  async ensurePermission() {
    if (!('Notification' in window)) return false;
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') return false;
    try { return (await Notification.requestPermission()) === 'granted'; }
    catch { return false; }
  },

  schedule() {
    clearInterval(this.timer);
    if (!Vault.data) return;
    const s = Vault.data.settings.reminders || {};
    if (!s.periodSoon && !s.logToday) return;
    this.check();
    this.timer = setInterval(() => this.check(), 30 * 60 * 1000);
  },

  check() {
    if (!Vault.data) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const s = Vault.data.settings.reminders || {};
    const today = todayYmd();

    // Log today reminder: after 6pm local, if nothing logged for today
    if (s.logToday && this.firedToday.logToday !== today) {
      const now = new Date();
      if (now.getHours() >= 18) {
        const d = Vault.data.days[today];
        const empty = !d || (d.flow === 'none' && !d.symptoms?.length && !d.mood?.length && !d.notes);
        if (empty) {
          new Notification(t('app.title'), { body: t('settings.reminder_log'), silent: false, tag: 'lunar-log-today' });
          this.firedToday.logToday = today;
        }
      }
    }

    // Period-soon reminder: if today is within leadDays of predicted window start
    if (s.periodSoon && this.firedToday.periodSoon !== today) {
      const pred = predict(Vault.data.cycles || []);
      if (pred) {
        const lead = Math.max(0, Number(s.leadDays) || 0);
        const earliest = ymd(addDays(parseYmd(pred.windowStart), -lead));
        if (today >= earliest && today <= pred.windowStart) {
          new Notification(t('app.title'), { body: t('settings.reminder_period'), silent: false, tag: 'lunar-period-soon' });
          this.firedToday.periodSoon = today;
        }
      }
    }
  },
};

async function ensureNotificationPermission() { return Reminders.ensurePermission(); }
function scheduleReminders() { Reminders.schedule(); }

// ---------------------------------------------------------------------------
// Network-denial claim
//
// The spec requires zero external network calls after first load, enforced by
// a service worker. A service worker registered from within this single HTML
// file would need to come from a Blob URL, and blob-URL workers get a scope
// that only covers the blob itself — they cannot intercept requests made by
// the hosting page. So a runtime-enforced SW is incompatible with the
// single-file constraint.
//
// Instead, the guarantee is source-level and verifiable:
//   1. Audit this file. Search for "fetch(" and "new XMLHttpRequest" and
//      "WebSocket" and "EventSource" and "navigator.sendBeacon". All absent.
//   2. The only network-capable call is the single favicon data: URL in the
//      <head>. Data URLs never leave the browser.
//   3. For deployment to a real origin, a companion /sw.js can be added to
//      the hosting repo to enforce the same-origin-only rule at runtime.
//      That file is out-of-band to the app itself.
//
// Users can verify by opening devtools → Network tab → using the app. Zero
// cross-origin requests will appear.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async function boot() {
  I18N.set('en');
  QuickHide.bind();

  if (!window.crypto?.subtle) {
    document.getElementById('root').innerHTML =
      `<div class="app"><div class="card"><h1>${t('app.title')}</h1><p>${t('errors.no_crypto')}</p></div></div>`;
    return;
  }
  const exists = await Vault.exists();
  if (!exists) {
    renderFirstRun();
    return;
  }
  const auto = await Vault.tryAutoUnlock();
  if (auto) {
    I18N.set(Vault.data.settings.language || 'en');
    applyTheme(Vault.data.settings.theme);
    state.view = 'today';
    render();
    scheduleReminders();
  } else {
    renderUnlock();
  }

  // Lock on hide — privacy default
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && Vault.hasPassphrase) {
      clearTimeout(window._lunarLockT);
      window._lunarLockT = setTimeout(() => {
        Vault.lock();
        renderUnlock();
      }, 5 * 60 * 1000);
    } else {
      clearTimeout(window._lunarLockT);
    }
  });
})();
</script>
</body>
</html>
